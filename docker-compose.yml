  postgres:
    image: postgres:15
    container_name: postgres-db
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - db-network


volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
  db-network:
    driver: bridge


  

